const grid=document.getElementById('grid'),sort=document.getElementById('sort'),minPrice=document.getElementById('minPrice'),maxPrice=document.getElementById('maxPrice');
let currentList=[];
function priceNumber(s){return Number(String(s).replace(/[^0-9]/g,''))||0}
function render(){const groups={};document.querySelectorAll('.filter-group[data-filter] input:checked').forEach(c=>{const g=c.closest('.filter-group').dataset.filter;(groups[g]??=[]).push(c.value)});let list=PRODUCTS.filter(p=>{
for(const g in groups){if(g==='color'&&!groups[g].includes(p.color))return false;if(g==='size'&&!groups[g].includes(p.size))return false;if(g==='cut'&&!groups[g].includes(p.cut))return false;if(g==='print'&&!groups[g].includes(p.print))return false}
const mn=priceNumber(minPrice.value),mx=priceNumber(maxPrice.value),pv=priceNumber(p.price);if(mn&&pv<mn)return false;if(mx&&pv>mx)return false;return true});
const s=sort.value;if(s==='priceAsc')list.sort((a,b)=>priceNumber(a.price)-priceNumber(b.price));if(s==='priceDesc')list.sort((a,b)=>priceNumber(b.price)-priceNumber(a.price));if(s==='name')list.sort((a,b)=>a.name.localeCompare(b.name));
currentList=list;
grid.innerHTML=list.map((p,i)=>`<article class="card" onclick="openZoom(${i})"><div class="photo"><img src="${p.img}" alt="${p.name}" loading="lazy"></div><span class="badge">${p.badge}</span><div class="name">${p.name} ${p.desc}</div><div class="old">$39.900</div><div class="price-line">${p.price} <span class="discount">${p.badge.includes('RELÁMPAGO')?'25% OFF':'10% OFF'}</span></div><div class="installments">6 x $5.985 sin interés</div><div class="transfer">${p.price==='$29.925'?'$25.436,25':'$30.523,50'} con Transferencia</div></article>`).join('');}
function contact(name){window.open('https://wa.me/543489686939?text='+encodeURIComponent('Hola SMOKE SALE, consulto por '+decodeURIComponent(name)+'.'),'_blank')}
document.querySelectorAll('.filters input').forEach(e=>e.addEventListener('change',render));sort.addEventListener('change',render);document.getElementById('priceGo').addEventListener('click',render);[minPrice,maxPrice].forEach(e=>e.addEventListener('keydown',x=>{if(x.key==='Enter')render()}));
document.getElementById('filterBtn').addEventListener('click',()=>{const f=document.getElementById('filters');f.style.display=getComputedStyle(f).display==='none'?'block':'none'});
const overlay=document.getElementById('zoomOverlay'),zoomImg=document.getElementById('zoomImg'),zoomMain=document.getElementById('zoomMain'),zoomInfo=document.getElementById('zoomInfo'),zoomThumbs=document.getElementById('zoomThumbs');
function colorHex(c){return{Negro:'#111',Celeste:'#19b9df',Beige:'#e2d0a8',Blanco:'#eee',Gris:'#888','Marrón':'#9b6a39',Violeta:'#8b49bb',Fucsia:'#e500a4'}[c]||'#ccc'}
function chgQty(d){const el=document.getElementById('zqty');el.textContent=Math.max(1,(+el.textContent||1)+d)}
function openZoom(i){
const p=currentList[i];if(!p)return;
zoomImg.src=p.img;zoomImg.alt=p.name;zoomImg.style.transform='scale(1)';
zoomThumbs.innerHTML=`<img class="sel" src="${p.img}" alt="${p.name}">`;
const disc=p.badge.includes('RELÁMPAGO')?'25% OFF':'10% OFF';
const transfer=p.price==='$29.925'?'$25.436,25':'$30.523,50';
zoomInfo.innerHTML=`<span class="zbadge">${p.badge}</span>
<div class="ztitle">${p.name} ${p.desc}</div>
<div class="zold">$39.900</div>
<div class="zprice">${p.price} <span class="zdisc">${disc}</span></div>
<div class="ztransfer">${transfer} con Transferencia</div>
<div class="zinst">6 cuotas sin interés de $5.985</div>
<div class="zopt">Corte: <b>${p.cut}</b></div><div><span class="zbtn sel">${p.cut}</span></div>
<div class="zopt">Talle: <b>${p.size}</b></div><div>${['S','M','L','XL','XXL','XXXL'].map(s=>`<span class="zbtn${s===p.size?' sel':''}">${s}</span>`).join('')}</div>
<div class="zopt">Color: <b>${p.color}</b></div><div><span class="zdot" style="background:${colorHex(p.color)}"></span></div>
<div class="zopt">Cantidad:</div>
<div style="display:flex;align-items:center"><span class="zqty"><button onclick="chgQty(-1)">−</button><span id="zqty">1</span><button onclick="chgQty(1)">+</button></span></div>
<button class="zcart" onclick="contact('${encodeURIComponent(p.name)}')">Agregar al carrito</button>`;
overlay.classList.add('open');document.body.style.overflow='hidden';
}
function closeZoom(){overlay.classList.remove('open');document.body.style.overflow=''}
document.getElementById('zoomClose').addEventListener('click',closeZoom);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeZoom()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
zoomMain.addEventListener('mouseenter',()=>{zoomImg.style.transform='scale(2.4)';zoomMain.classList.add('zoomed')});
zoomMain.addEventListener('mousemove',e=>{const r=zoomMain.getBoundingClientRect();zoomImg.style.transformOrigin=(((e.clientX-r.left)/r.width)*100)+'% '+(((e.clientY-r.top)/r.height)*100)+'%'});
zoomMain.addEventListener('mouseleave',()=>{zoomImg.style.transform='scale(1)';zoomMain.classList.remove('zoomed')});
render();</script></body></html>
