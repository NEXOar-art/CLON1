.drawer{display:none}

@media(max-width:850px){.page{padding:0 14px}.layout{grid-template-columns:1fr}.filters{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:15px}.photo{height:240px}.drawer{display:block;border:1px solid #ddd;background:#fff;padding:9px 11px;margin-bottom:14px;font-size:11px}.zoom-layout{grid-template-columns:1fr}.zoom-thumbs{flex-direction:row}.zoom-main{min-height:320px}}

</style></head><body>

<section class="filter-group"><h3>PRECIO</h3><div class="price"><div><label>Desde</label><input id="minPrice" type="number" placeholder="26000"></div><div><label>Hasta</label><input id="maxPrice" type="number" placeholder="440040"></div><button id="priceGo">›</button></div></section>

<div class="zoom-layout">

<script>
/* =====================================================================
   ÚNICO PASO MANUAL: en tu línea gigante original cambiá solamente
   "const PRODUCTS=["  por  "const PRODUCTS_BASE=["   (nada más).
   Así las imágenes base64 quedan intactas y yo armo el array final.
   ===================================================================== */
/* ==== ARRAY DE PRODUCTOS (metadatos nuevos: código SKU + flag NUEVO) ==== */
const PRODUCT_META=[
{code:"SMK-001",nuevo:true},{code:"SMK-002",nuevo:true},{code:"SMK-003",nuevo:true},{code:"SMK-004",nuevo:true},
{code:"SMK-005",nuevo:true},{code:"SMK-006",nuevo:true},{code:"SMK-007",nuevo:true},{code:"SMK-008",nuevo:true},
{code:"SMK-009",nuevo:true},{code:"SMK-010",nuevo:true},{code:"SMK-011",nuevo:true},{code:"SMK-012",nuevo:true},
{code:"SMK-013",nuevo:true},{code:"SMK-014",nuevo:true},{code:"SMK-015",nuevo:true},{code:"SMK-016",nuevo:true},
{code:"SMK-017",nuevo:true},{code:"SMK-018",nuevo:true},{code:"SMK-019",nuevo:true},{code:"SMK-020",nuevo:true},
{code:"SMK-021",nuevo:true},{code:"SMK-022",nuevo:true},{code:"SMK-023",nuevo:true},{code:"SMK-024",nuevo:true}];
/* ==== ARRAY FINAL = imágenes originales + metadatos nuevos ==== */
const PRODUCTS=(typeof PRODUCTS_BASE!=='undefined'?PRODUCTS_BASE:[]).map((p,i)=>Object.assign({},p,PRODUCT_META[i]||{code:'SMK-'+String(i+1).padStart(3,'0'),nuevo:true}));

const grid=document.getElementById('grid'),sort=document.getElementById('sort'),minPrice=document.getElementById('minPrice'),maxPrice=document.getElementById('maxPrice');
let currentList=[];
function priceNumber(s){return Number(String(s).replace(/[^0-9]/g,''))||0}
const CART_SVG='<svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>';
function render(){
const groups={};
document.querySelectorAll('.filter-group[data-filter] input:checked').forEach(c=>{const g=c.closest('.filter-group').dataset.filter;(groups[g]??=[]).push(c.value)});
let list=PRODUCTS.filter(p=>{
for(const [key,vals] of Object.entries(groups)) if(!vals.includes(p[key])) return false;
const pr=priceNumber(p.price); if(minPrice.value&&pr<+minPrice.value)return false;if(maxPrice.value&&pr>+maxPrice.value)return false;return true;
});
if(sort.value==='priceAsc')list.sort((a,b)=>priceNumber(a.price)-priceNumber(b.price));
if(sort.value==='priceDesc')list.sort((a,b)=>priceNumber(b.price)-priceNumber(a.price));
if(sort.value==='name')list.sort((a,b)=>a.name.localeCompare(b.name));
currentList=list;
grid.innerHTML=list.map((p,i)=>`<article class="card" data-i="${i}">
<div class="photo"><img src="${p.img}" alt="${p.name}" loading="lazy"><span class="tag">NUEVO</span></div>
<div class="card-body">
<div class="name">${p.name} ${p.desc}</div>
<div class="code">Código ${p.code}</div>
<div class="price-line">$ ${p.price.replace('$','')}</div>
<div class="stepper"><span class="q">1</span><button type="button" data-d="1" aria-label="Subir">▲</button><button type="button" data-d="-1" aria-label="Bajar">▼</button></div>
<button type="button" class="comprar">COMPRAR ${CART_SVG}</button>
<div class="iva">C/Iva</div>
</div></article>`).join('');
}
function contact(name,qty,code){window.open('https://wa.me/543489686939?text='+encodeURIComponent('Hola SMOKE SALE, quiero comprar '+decodeURIComponent(name)+(code?' (Código '+code+')':'')+(qty>1?' x'+qty:'')+'.'),'_blank')}
/* Click en tarjeta → zoom · stepper → cantidad · COMPRAR → WhatsApp */
grid.addEventListener('click',e=>{
const card=e.target.closest('.card');if(!card)return;
const i=+card.dataset.i,p=currentList[i];
const sb=e.target.closest('.stepper button');
if(sb){const q=card.querySelector('.q');q.textContent=Math.max(1,+q.textContent+ +sb.dataset.d);return}
if(e.target.closest('.comprar')){contact(encodeURIComponent(p.name),+card.querySelector('.q').textContent,p.code);return}
openZoom(i);
});
/* ===== ZOOM ===== */
const overlay=document.getElementById('zoomOverlay'),zoomImg=document.getElementById('zoomImg'),zoomMain=document.getElementById('zoomMain'),zoomInfo=document.getElementById('zoomInfo'),zoomThumbs=document.getElementById('zoomThumbs');
let zSel={size:'',cut:''};
function colorHex(c){return{Negro:'#111',Celeste:'#19b9df',Beige:'#e2d0a8',Blanco:'#eee',Gris:'#888','Marrón':'#9b6a39',Violeta:'#8b49bb',Fucsia:'#e500a4'}[c]||'#ccc'}
function openZoom(i){const p=currentList[i];if(!p)return;
zSel={size:p.size,cut:p.cut};
zoomImg.src=p.img;zoomImg.style.transform='scale(1)';
zoomThumbs.innerHTML=`<img class="sel" src="${p.img}" alt="${p.name}">`;
zoomInfo.innerHTML=`<span class="zbadge">${p.badge}</span>
<div class="ztitle">${p.name}</div><div class="zsub">Código ${p.code} · ${p.desc}</div>
<div class="zold">$39.900</div>
<div class="zprice">${p.price}<span class="zdisc">${p.badge.includes('RELÁMPAGO')?'25% OFF':'10% OFF'}</span></div>
<div class="ztransfer">${p.price==='$29.925'?'$25.436,25':'$30.523,50'} con Transferencia</div>
<div class="zinst">6 cuotas sin interés de $5.985</div>
<div class="zopt">Corte: <b>${p.cut}</b></div><div><span class="zbtn sel">${p.cut}</span></div>
<div class="zopt">Talle: <b>${p.size}</b></div><div>${['S','M','L','XL','XXL','XXXL'].map(s=>`<span class="zbtn${s===p.size?' sel':''}">${s}</span>`).join('')}</div>
<div class="zopt">Color: <b>${p.color}</b></div><div><span class="zdot" style="background:${colorHex(p.color)}"></span></div>
<div class="zopt">Cantidad:</div>
<div style="display:flex;align-items:center;gap:10px"><span class="zqty"><button type="button" data-d="-1">−</button><span class="q">1</span><button type="button" data-d="1">+</button></span></div>
<button class="zcart" id="zcart">Agregar al carrito</button>
<div class="zprotect">🛡️ <span><b>Compra protegida</b><br>Tus datos cuidados durante toda la compra.</span></div>`;
overlay.classList.add('open');document.body.style.overflow='hidden';}
zoomInfo.addEventListener('click',e=>{
const qb=e.target.closest('.zqty button');
if(qb){const q=zoomInfo.querySelector('.zqty .q');q.textContent=Math.max(1,+q.textContent+ +qb.dataset.d);return}
if(e.target.id==='zcart'){const p=currentList.find(x=>zoomInfo.querySelector('.ztitle').textContent===x.name);contact(encodeURIComponent(p.name),+zoomInfo.querySelector('.zqty .q').textContent,p.code)}});
zoomMain.addEventListener('mouseenter',()=>{zoomImg.style.transform='scale(2.4)';zoomMain.classList.add('zoomed')});
zoomMain.addEventListener('mousemove',e=>{const r=zoomMain.getBoundingClientRect();zoomImg.style.transformOrigin=(((e.clientX-r.left)/r.width)*100)+'% '+(((e.clientY-r.top)/r.height)*100)+'%'});
zoomMain.addEventListener('mouseleave',()=>{zoomImg.style.transform='scale(1)';zoomMain.classList.remove('zoomed')});
const closeZoom=()=>{overlay.classList.remove('open');document.body.style.overflow=''};
document.getElementById('zoomClose').addEventListener('click',closeZoom);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeZoom()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
/* ===== FILTROS / ORDEN (intactos) ===== */
document.querySelectorAll('.filters input').forEach(e=>e.addEventListener('change',render));sort.addEventListener('change',render);document.getElementById('priceGo').addEventListener('click',render);
[minPrice,maxPrice].forEach(e=>e.addEventListener('keydown',x=>{if(x.key==='Enter')render()}));
document.getElementById('filterBtn').addEventListener('click',()=>{const f=document.getElementById('filters');f.style.display=getComputedStyle(f).display==='none'?'block':'none'});
render();
</script>
</body></html>
