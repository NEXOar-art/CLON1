<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:auto;padding:0 20px}
/* ===== HEADER STICKY + LOGO ===== */
.header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 0}
.brand{display:flex;align-items:center;gap:16px}
.logo{height:76px;width:auto;display:block}

.topbar{display:flex;align-items:center;gap:10px}
.topbar label{font-size:11px;color:var(--muted)}
select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 10px;font-size:12px;color:var(--ink)}
/* ===== LAYOUT ===== */
.layout{display:grid;grid-template-columns:210px 1fr;gap:30px;padding:26px 0 70px}
.filters h2{font-size:15px;font-weight:700;margin:0 0 16px}
.filter-group{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
.filter-group h3{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.check{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px;color:#3f3f46;cursor:pointer}
.check input{appearance:none;width:15px;height:15px;border:1px solid #c9c9cf;border-radius:4px;margin:0;cursor:pointer;transition:.15s}
.check input:checked{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 3px #fff}
.dot{width:8px;height:8px;border-radius:50%}
.more{font-size:11px;text-decoration:underline;color:var(--muted);cursor:pointer}
.price{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px}
.price label{font-size:9px;color:var(--muted)}
.price input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:12px}
.price button{height:36px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-size:16px;cursor:pointer}
.drawer{display:none;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:12px;margin:16px 0 0;cursor:pointer}
.catalog-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 16px}
.count{font-size:12px;color:var(--muted)}
/* ===== TARJETAS LIMPIAS ===== */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:#dcdce0}
.photo{position:relative;aspect-ratio:1/1;background:var(--panel);display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.card:hover .photo img{transform:scale(1.06)}
.badge{position:absolute;top:10px;left:10px;background:#c83a2d;color:#fff;border-radius:6px;font-size:9px;font-weight:800;letter-spacing:.05em;padding:4px 8px;text-transform:uppercase}
.badge.flash{background:var(--orange)}
.zoomtag{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:10px;font-weight:700;opacity:0;transform:translateY(4px);transition:.2s;pointer-events:none}
.card:hover .zoomtag{opacity:1;transform:none}
.card-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.name{font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.35}
.name .desc{display:block;color:var(--muted);font-weight:500;font-size:10px;text-transform:none;margin-top:2px}
.old{font-size:11px;color:#a1a1aa;text-decoration:line-through}
.price-line{font-size:16px;font-weight:800}
.discount{font-size:11px;color:var(--orange);font-weight:700;margin-left:6px}
.installments{font-size:11px;color:var(--muted)}
.transfer{font-size:11.5px;color:var(--transfer);font-weight:700}
.qty-row{margin-top:auto;display:flex;gap:8px;padding-top:12px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:38px;border:0;background:#f4f4f5;cursor:pointer;font-size:15px;color:var(--ink)}
.qty button:hover{background:#e8e8ea}

.buy{flex:1;background:var(--green);color:#fff;border:0;border-radius:9px;font-weight:800;font-size:11.5px;letter-spacing:.05em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
.buy:hover{background:var(--green-d)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0;border:1px dashed var(--line);border-radius:var(--r)}
/* ===== WHATSAPP ===== */
.whatsapp{position:fixed;right:22px;bottom:22px;background:#1fbd63;color:#fff;border-radius:999px;padding:13px 18px;box-shadow:0 10px 30px rgba(31,189,99,.35);display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;z-index:60;text-decoration:none}
.wa-icon{width:22px;height:22px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:11px}

.zoom-overlay{position:fixed;inset:0;background:rgba(20,20,22,.45);backdrop-filter:blur(4px);z-index:80;display:none;overflow:auto;padding:28px 16px}

.zoom-modal{max-width:1120px;margin:auto;background:#fff;border-radius:16px;padding:26px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.25)}

.zoom-close:hover{background:#e8e8ea}
.zoom-layout{display:grid;grid-template-columns:84px minmax(0,1fr) 380px;gap:26px}
.thumbs{display:flex;flex-direction:column;gap:10px}

.zcount{position:absolute;top:10px;right:12px;font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.zhint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.crumb{font-size:11px;color:var(--muted)}
.zbadge{display:inline-block;background:#c83a2d;color:#fff;border-radius:6px;font-size:9px;font-weight:800;padding:4px 8px;text-transform:uppercase;margin-top:10px}

.ztitle{font-size:22px;font-weight:700;line-height:1.25;margin:10px 0 2px}
.zsub{font-size:11px;color:var(--muted)}
.zold{font-size:12px;color:#a1a1aa;text-decoration:line-through;margin-top:12px}
.zpriceline{display:flex;align-items:baseline;gap:10px}
.zprice{font-size:26px;font-weight:800}
.zoff{color:var(--orange);font-weight:700;font-size:13px}
.ztax{font-size:11px;color:var(--muted)}
.ztransfer{color:var(--transfer);font-weight:800;font-size:16px;margin:8px 0 2px}
.zdisc2{color:var(--orange);font-size:12px}
.zinst{font-size:12px;color:var(--muted);margin-top:6px}
.zlink{font-size:11px;text-decoration:underline;color:var(--muted);margin-top:6px}
.zship{display:flex;gap:8px;font-size:12px;color:var(--muted);margin:12px 0}
.opt-title{font-size:12px;margin:12px 0 6px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:11px;cursor:pointer;background:#fff;transition:.15s}

.zqty .q{min-width:38px;text-align:center;font-size:13px;font-weight:600}
.zcart{flex:1;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:14px;font-weight:800;font-size:13px;cursor:pointer;transition:.2s}

/* ===== RESPONSIVE ===== */
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}

});
zmain.addEventListener('mouseenter',()=>{zimg.style.transform='scale(2.2)';zmain.classList.add('zoomed')});
zmain.addEventListener('mousemove',e=>{const r=zmain.getBoundingClientRect();zimg.style.transformOrigin=(((e.clientX-r.left)/r.width)*100)+'% '+(((e.clientY-r.top)/r.height)*100)+'%'});
zmain.addEventListener('mouseleave',()=>{zimg.style.transform='scale(1)';zmain.classList.remove('zoomed')});
const closeZoom=()=>{overlay.classList.remove('open');document.body.style.overflow=''};
document.getElementById('zoomClose').addEventListener('click',closeZoom);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeZoom()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeZoom()});
/* ===== FILTROS / ORDEN (intacto) ===== */
document.querySelectorAll('.filters input').forEach(e=>e.addEventListener('change',render));
sort.addEventListener('change',render);
document.getElementById('priceGo').addEventListener('click',render);
[minPrice,maxPrice].forEach(e=>e.addEventListener('keydown',x=>{if(x.key==='Enter')render()}));
document.getElementById('filterBtn').addEventListener('click',()=>{const f=document.getElementById('filters');f.style.display=getComputedStyle(f).display==='none'?'block':'none'});
render();
</script>
</body></html>
